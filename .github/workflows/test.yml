name: Test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-github-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Package
        run: npm run package

      - name: Create test log fixture
        run: |
          # Plan: summary on STDOUT (common case)
          printf '%s\n' \
            '21:58:59.842 INFO   [network/init-only] terraform: should now work.' \
            '21:58:59.883 STDOUT [messaging/service-buses/consumption/queues] terraform: Terraform will perform the following actions:' \
            '21:58:59.884 STDOUT [messaging/service-buses/consumption/queues] terraform:   # azurerm_servicebus_queue.this["export_queue"] will be updated in-place' \
            '21:58:59.884 STDOUT [messaging/service-buses/consumption/queues] terraform:   ~ resource "azurerm_servicebus_queue" "this" {' \
            '21:58:59.884 STDOUT [messaging/service-buses/consumption/queues] terraform:       ~ lock_duration = "PT5M" -> "PT10M"' \
            '21:58:59.884 STDOUT [messaging/service-buses/consumption/queues] terraform:     }' \
            '21:58:59.884 STDOUT [messaging/service-buses/consumption/queues] terraform: Plan: 0 to add, 1 to change, 0 to destroy.' \
            '21:59:00.000 STDOUT [node-pools/market-mobility-pool] terraform: Terraform will perform the following actions:' \
            '21:59:00.001 STDOUT [node-pools/market-mobility-pool] terraform:   + resource "azurerm_kubernetes_cluster_node_pool" "this" {' \
            '21:59:00.001 STDOUT [node-pools/market-mobility-pool] terraform:       + name = "marketpool4"' \
            '21:59:00.001 STDOUT [node-pools/market-mobility-pool] terraform:     }' \
            '21:59:00.002 STDERR [node-pools/market-mobility-pool] terraform: Plan: 1 to add, 0 to change, 0 to destroy.' \
            '21:59:10.179 STDOUT [network/dns-ns-records/no-change] terraform: No changes. Your infrastructure matches the configuration.' \
            '21:59:10.179 STDOUT [network/dns-ns-records/no-change] terraform: Plan: 0 to add, 0 to change, 0 to destroy.' \
            > /tmp/tg-plan-test.txt

      - name: Run action
        id: diff
        uses: ./
        with:
          log_file: '/tmp/tg-plan-test.txt'
          mode: 'summary'

      - name: Verify outputs
        run: |
          echo "has_changes: ${{ steps.diff.outputs.has_changes }}"
          echo "changes_json: ${{ steps.diff.outputs.changes_json }}"

          [[ "${{ steps.diff.outputs.has_changes }}" == "true" ]] || (echo "FAIL: expected has_changes=true" && exit 1)

          # both modules with changes must appear
          echo '${{ steps.diff.outputs.changes_json }}' | jq -e 'length == 2'

          # messaging: Plan on STDOUT
          echo '${{ steps.diff.outputs.changes_json }}' | jq -e 'map(select(.module == "messaging/service-buses/consumption/queues")) | .[0].toChange == 1'

          # node-pools: Plan on STDERR — this is the case that was broken
          echo '${{ steps.diff.outputs.changes_json }}' | jq -e 'map(select(.module == "node-pools/market-mobility-pool")) | .[0].toAdd == 1'

          # no-change module must not appear
          echo '${{ steps.diff.outputs.changes_json }}' | jq -e 'map(.module) | contains(["network/dns-ns-records/no-change"]) | not'

          echo "All assertions passed"
